name: Deploy Admin Panel

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/admin-panel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/admin-panel/package-lock.json

      - run: npm ci
      - name: Set API URL
        run: |
          test -n "$API_BASE_URL" || { echo "Repository variable API_BASE_URL is not set"; exit 1; }
          sed -i "s|__API_BASE_URL__|$API_BASE_URL|" src/environments/environment.production.ts
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}

      - run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ADMIN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: Frontend/admin-panel/dist/admin-panel/browser
          api_location: ''
          skip_app_build: true
