name: Deploy API

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Backend/SecureBooking.Api/SecureBooking.Api.csproj

      - name: Build
        run: dotnet build Backend/SecureBooking.Api/SecureBooking.Api.csproj -c Release --no-restore

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Load connection string from Azure app settings
        env:
          APP_NAME: hotel-booking-api
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          test -n "$RESOURCE_GROUP" || { echo "::error::Repository variable AZURE_RESOURCE_GROUP is not set"; exit 1; }
          CS=$(az webapp config appsettings list -g "$RESOURCE_GROUP" -n "$APP_NAME" --query "[?name=='ConnectionStrings__DefaultConnection'].value | [0]" -o tsv)
          test -n "$CS" || { echo "::error::App setting ConnectionStrings__DefaultConnection not found on $APP_NAME"; exit 1; }
          echo "::add-mask::$CS"
          echo "ConnectionStrings__DefaultConnection=$CS" >> "$GITHUB_ENV"

      - name: Apply EF Core migrations
        run: |
          dotnet tool install --global dotnet-ef --version 10.*
          EF_ARGS="--project Backend/SecureBooking.Infrastructure/SecureBooking.Infrastructure.csproj --startup-project Backend/SecureBooking.Api/SecureBooking.Api.csproj --configuration Release --no-build"

          echo "::group::Migrations before"
          dotnet ef migrations list $EF_ARGS
          echo "::endgroup::"

          dotnet ef database update $EF_ARGS --verbose

          echo "::group::Migrations after"
          dotnet ef migrations list $EF_ARGS
          echo "::endgroup::"

      - name: Publish API
        run: dotnet publish Backend/SecureBooking.Api/SecureBooking.Api.csproj -c Release --no-build -o ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: hotel-booking-api
          package: ./publish
