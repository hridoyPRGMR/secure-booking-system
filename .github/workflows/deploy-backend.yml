name: Deploy API

on:
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Backend/SecureBooking.Api/SecureBooking.Api.csproj

      - name: Build
        run: dotnet build Backend/SecureBooking.Api/SecureBooking.Api.csproj -c Release --no-restore

      - name: Apply EF Core migrations
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.DB_CONNECTION_STRING }}
        run: |
          test -n "$ConnectionStrings__DefaultConnection" || { echo "::error::Environment secret DB_CONNECTION_STRING is empty or not set"; exit 1; }
          dotnet tool install --global dotnet-ef --version 10.*
          EF_ARGS="--project Backend/SecureBooking.Infrastructure/SecureBooking.Infrastructure.csproj --startup-project Backend/SecureBooking.Api/SecureBooking.Api.csproj --configuration Release --no-build"

          echo "::group::Migrations before"
          dotnet ef migrations list $EF_ARGS
          echo "::endgroup::"

          dotnet ef database update $EF_ARGS --verbose

          echo "::group::Migrations after"
          dotnet ef migrations list $EF_ARGS
          echo "::endgroup::"

      - name: Publish API
        run: dotnet publish Backend/SecureBooking.Api/SecureBooking.Api.csproj -c Release --no-build -o ./publish

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: hotel-booking-api
          package: ./publish

      - name: Health check
        env:
          APP_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/health" || true)
            echo "Attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::Health check failed at $APP_URL/health"
          exit 1
