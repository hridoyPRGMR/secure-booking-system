name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore Backend/SecureBooking.Api/SecureBooking.Api.csproj
      - run: dotnet build Backend/SecureBooking.Api/SecureBooking.Api.csproj -c Release --no-restore

  frontend:
    name: ${{ matrix.app }} build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin-panel, secure-booking-web]
    defaults:
      run:
        working-directory: Frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/${{ matrix.app }}/package-lock.json

      - run: npm ci
      - run: npm run build
